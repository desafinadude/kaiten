<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaiten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#21385b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaiten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: one screen, no page scroll. Noren header, the belt, a wooden table (market, stations, diners), and your counter tray. */
:root{--wall:#1c1814;--wood:#e6cd9f;--wood-2:#d6b682;--wood-3:#b88d55;--wood-dk:#7a532b;--ink:#2b1f14;--ink-2:#5b4733;--paper:#fcf7ec;--paper-2:#efe4cc;--indigo:#21385b;--indigo-2:#142640;--lac:#c2342a;--lac-2:#8f1f17;--gold:#d2a43c;--ice:#eef7fa;--ice-2:#cfe4ec;--steel:#8d989b;--steel-2:#6e797c;--c-nigiri:#c8392b;--c-maki:#2c5a39;--c-sashimi:#e07a3f;--c-special:#c0921f;--p0:#2f62c4;--p1:#d24a2f;--p2:#d9a51a;--p3:#1f9488;--disp:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  color-scheme:light;height:100%;box-sizing:border-box;overflow:hidden;scrollbar-width:none;background:var(--wall)}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--ink)}
.k{height:100%;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;background:radial-gradient(120% 70% at 50% 0%,#3d3026 0%,var(--wall) 70%)}
.k *{box-sizing:border-box;scrollbar-width:none}
.k *::-webkit-scrollbar{display:none;width:0;height:0}
.k :where(button){font:inherit;color:inherit}
.k :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.in{max-width:1200px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.ic{display:inline-block;flex:none;width:20px;height:20px;object-fit:contain;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:32px;height:32px}.ic.xl{width:46px;height:46px}
.face{display:block;flex:none;object-fit:cover;border-radius:50%;background:#f6ecd8;box-shadow:0 0 0 2px #fffaf0,0 2px 4px rgba(0,0,0,.25)}
.c-nigiri{--cat:var(--c-nigiri)}.c-maki{--cat:var(--c-maki)}.c-sashimi{--cat:var(--c-sashimi)}.c-special{--cat:var(--c-special)}
.pc0{--pc:var(--p0)}.pc1{--pc:var(--p1)}.pc2{--pc:var(--p2)}.pc3{--pc:var(--p3)}

/* noren header */
.noren{position:relative;flex:none;background:linear-gradient(rgba(20,38,64,0),rgba(20,38,64,.45)),url(art/tex-noren.webp) 0 0/360px,linear-gradient(var(--indigo),var(--indigo-2));color:#f4efe4;box-shadow:0 4px 0 rgba(0,0,0,.25);z-index:8}
.noren::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:repeating-linear-gradient(90deg,var(--indigo-2) 0 calc(12.5% - 4px),transparent calc(12.5% - 4px) 12.5%);pointer-events:none}
.noren .in{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;min-height:62px}
.logo{display:flex;align-items:baseline;gap:8px}
.logo .jp{font-family:var(--disp);font-size:24px;line-height:1;color:#fff}
.logo .en{font-family:var(--disp);font-size:13px;letter-spacing:.3em;color:#c9d3e6}
.lanterns{display:flex;gap:6px;align-items:center}
.lantern{width:14px;height:19px;border-radius:7px/9px;background:#3a4d6e;position:relative}
.lantern::before,.lantern::after{content:"";position:absolute;left:3px;right:3px;height:3px;background:#0d1626;border-radius:1px}
.lantern::before{top:-1px}.lantern::after{bottom:-1px}
.lantern.done{background:#8a5a3a}
.lantern.now{background:#ff6a3d;box-shadow:0 0 10px 3px rgba(255,120,60,.65)}
.who-turn{display:flex;align-items:flex-end;gap:10px;flex:1 1 180px;min-width:0}
.turnface{width:44px;height:44px}
.turn{min-width:0;display:flex;flex-direction:column}
.turn .lead{font-weight:900;font-size:15px}
.turn .lead.mine{color:#ffd27a}
.turn .sub{font-size:12px;color:#b9c4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hanko{width:52px;height:52px;border-radius:50%;background:var(--lac);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 3px 0 var(--lac-2);flex:none}
.hanko b{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1}
.hanko span{font-size:8px;letter-spacing:.2em;font-weight:900}

/* belt */
.beltzone{flex:none;padding-top:16px}
.track{position:relative;border-radius:16px;padding:12px 10px 10px;background:url(art/tex-belt.webp) 0 0/200px 100%,repeating-linear-gradient(90deg,var(--steel) 0 46px,var(--steel-2) 46px 48px);box-shadow:inset 0 7px 0 #b9c2c4,inset 0 -7px 0 #4d5658,0 6px 14px rgba(0,0,0,.45);animation:roll 14s linear infinite;overflow-x:auto;overflow-y:hidden}
@keyframes roll{to{background-position:200px 0,48px 0}}
.track.dark{animation:none}
.beltzone .in{position:relative}
.cut{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-2deg);z-index:3;background:#1b140e;color:#fff;border:2px solid #ffd27a;border-radius:8px;padding:6px 14px;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none}
.cut span{font-family:var(--disp);color:#ffd27a;margin-right:4px}
.belt{display:grid;grid-template-columns:repeat(5,minmax(132px,1fr));gap:10px;min-width:min-content}
.bslot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative}
.belt .plabel{flex:1 1 auto}
.bsign{position:absolute;top:-4px;left:2px;z-index:2;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--paper);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bsign.last{background:var(--lac);color:#fff}
.bempty{width:100px;height:100px;border-radius:50%;border:3px dashed rgba(255,255,255,.35)}
.bempty.took{display:flex;align-items:center;justify-content:center}
.pwrap{position:relative}
.bgn{position:absolute;left:-6px;bottom:2px;z-index:2;min-width:28px;height:28px;padding:0 4px;border-radius:14px;background:#2f7d4a;color:#fff;font-family:var(--disp);font-size:14px;line-height:28px;text-align:center;box-shadow:0 0 0 2px #fff,0 3px 6px rgba(0,0,0,.35);transform:rotate(-8deg)}
.oticket .bgn{left:auto;right:auto;top:-10px;bottom:auto;left:-8px;width:26px;min-width:26px;height:26px;line-height:26px;font-size:13px}
.hc-bgn .bgn,.cbgn .bgn{position:static;display:inline-block;transform:none;vertical-align:middle;margin-right:4px;height:22px;line-height:22px;min-width:24px;font-size:12px}
.hc-bgn,.cbgn{margin:0;font-weight:700;color:#2f7d4a}
.bgnote{color:#2f7d4a!important}
.belt .plabel .ab.bgnote{display:block}
.bgnote b{font-family:var(--disp);font-weight:400}
.cost .skip,.ci.skip{position:relative;opacity:.45}
.cost .skip::after,.ci.skip::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:#2f7d4a;transform:rotate(-35deg)}
.cost .skip{display:inline-block}
.bempty.took .face{width:46%;height:46%;opacity:.85}
.tookby{font-size:11px;font-weight:900;color:#fff;background:rgba(27,20,14,.75);border-radius:999px;padding:2px 9px}
.pwrap{display:block}
.pwrap.fresh{animation:beltin .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes beltin{from{transform:translateX(-80px) rotate(-30deg);opacity:0}}
.plate{position:relative;width:100px;height:100px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fffdf8 0 50%,var(--cat) 51% 60%,#fffdf8 61% 66%,var(--cat) 67% 100%);box-shadow:0 5px 0 rgba(0,0,0,.22),0 9px 14px rgba(0,0,0,.25)}
.dart{width:82%;height:auto;display:block;margin-top:-4px;pointer-events:none}
.vpb{position:absolute;top:-4px;right:-4px;width:30px;height:30px;border-radius:50%;background:var(--paper);border:3px solid var(--cat);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;color:var(--ink)}
.wsb{position:absolute;bottom:-2px;left:-4px;display:flex;gap:1px;background:var(--paper);border-radius:10px;padding:2px 4px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.wsb .ic{width:13px;height:13px}
.plabel{width:100%;max-width:200px;background:url(art/tex-paper.webp) 0 0/320px,var(--paper);border-radius:7px;padding:5px 8px 6px;box-shadow:0 2px 0 rgba(0,0,0,.25);text-align:center;border-top:3px solid var(--cat);display:flex;flex-direction:column;gap:1px}
.plabel .nm{font-weight:900;font-size:13px;line-height:1.15}
.plabel .ct{font-size:9.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--cat)}
.plabel .ab{font-size:11px;color:var(--ink-2);line-height:1.25}
.plabel .cost{justify-content:center;margin-top:3px}
.plabel .cost .ic{width:17px;height:17px}
.cost{display:flex;flex-wrap:wrap;gap:2px;align-items:center}

/* wooden table */
.table{flex:1;min-height:0;margin-top:14px;background:url(art/tex-ash.webp) 0 0/900px auto repeat,linear-gradient(var(--wood),var(--wood-2));box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.table>.in{height:100%;padding-top:12px;padding-bottom:12px}
.tin{height:100%;display:grid;grid-template-columns:214px minmax(0,1fr);grid-template-areas:"market kitchen";gap:16px}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.pane-market{grid-area:market}.pane-kitchen{grid-area:kitchen}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex:none}
.ph h2{margin:0;font-family:var(--disp);font-weight:400;font-size:16px}
.ph .kj{font-family:var(--disp);color:var(--lac);font-size:13px}
.ph p{margin:0;font-size:12px;color:var(--ink-2)}
.scroll{flex:1;min-height:0;overflow:auto;padding:2px 6px 14px 2px;-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}

/* stations */
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 10px}
.board{position:relative;text-align:left;cursor:default;border:2px solid var(--wood-dk);border-radius:12px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:4px;min-height:140px;background:linear-gradient(rgba(255,246,224,.38),rgba(255,246,224,.2)),url(art/tex-table.webp) 0 0/300px,linear-gradient(#f3e0b9,#e3c48e);box-shadow:0 4px 0 var(--wood-dk),0 8px 12px rgba(60,35,10,.22);opacity:.62;filter:saturate(.6)}
.board.can{opacity:1;filter:none;cursor:pointer;border-color:var(--lac);box-shadow:0 4px 0 var(--lac-2),0 0 0 3px rgba(194,52,42,.25),0 10px 16px rgba(60,35,10,.3);animation:glow 1.6s ease-in-out infinite}
.board.can:hover{transform:translateY(-2px)}
.board.can:active{transform:translateY(2px);box-shadow:0 2px 0 var(--lac-2)}
.board.combo{border-color:#d2a43c;box-shadow:0 4px 0 #9a7420,0 0 0 4px rgba(210,164,60,.55),0 10px 18px rgba(60,35,10,.3);animation:comboglow 1.2s ease-in-out infinite}
@keyframes comboglow{50%{box-shadow:0 4px 0 #9a7420,0 0 0 9px rgba(210,164,60,.3),0 10px 18px rgba(60,35,10,.3)}}
.ribbon{position:absolute;right:8px;bottom:8px;z-index:2;background:linear-gradient(#e7bb4f,#c79622);color:#fff;font-family:var(--disp);font-size:11.5px;letter-spacing:.04em;white-space:nowrap;padding:3px 10px;border-radius:6px;box-shadow:0 2px 0 #8a6516,0 4px 8px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.25);pointer-events:none}
@media (max-width:640px){.ribbon{right:auto;bottom:auto;top:-8px;left:4px;font-size:10px;padding:2px 7px}}
@keyframes glow{50%{box-shadow:0 4px 0 var(--lac-2),0 0 0 6px rgba(194,52,42,.18),0 10px 16px rgba(60,35,10,.3)}}
.board.live{opacity:1;filter:none}
.board .kj{position:absolute;top:8px;right:8px;font-family:var(--disp);font-size:12px;color:var(--lac);opacity:.85;writing-mode:vertical-rl;letter-spacing:.1em}
.board .top{display:flex;align-items:center;gap:7px;padding-right:16px}
.sticon{width:36px;height:36px;flex:none}
.board .bn{font-family:var(--disp);font-size:15px;line-height:1.1}
.board .bt{font-size:12px;color:var(--ink-2);line-height:1.3;padding-right:16px}
.board .why{font-size:11px;font-weight:700;color:var(--lac-2)}
.holes{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center}
.hole{width:34px;height:34px;border-radius:50%;background:#caa66c;box-shadow:inset 0 3px 5px rgba(60,35,10,.45);display:flex;align-items:center;justify-content:center}
.hole .face{width:30px;height:30px}
.open-all{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* market and regulars */
.ice{border-radius:14px;padding:10px;border:3px solid #9cb7c1;background:radial-gradient(circle at 25% 30%,#fff 0 2px,transparent 3px) 0 0/15px 15px,radial-gradient(circle at 70% 70%,#fff 0 1.5px,transparent 2.5px) 0 0/11px 11px,linear-gradient(var(--ice),var(--ice-2));background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)),url(art/tex-ice-cover.webp) center/cover no-repeat,linear-gradient(var(--ice),var(--ice-2));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;box-shadow:0 4px 0 #7f9aa4}
.fish{display:flex;flex-direction:column;align-items:center;gap:2px;width:50px;font-size:10.5px;font-weight:900;color:#2c3c42}
.deck{font-size:11px;color:var(--ink-2);text-align:right;margin:8px 0 14px}
.tickets{display:flex;flex-direction:column;gap:8px}
.ticket{position:relative;display:flex;align-items:center;gap:10px;background:url(art/tex-paper.webp) 0 0/320px,var(--paper);padding:8px 46px 8px 8px;border-radius:3px;box-shadow:0 3px 6px rgba(60,35,10,.25);border-top:3px dotted var(--paper-2)}
.ticket:nth-child(odd){transform:rotate(-.8deg)}.ticket:nth-child(even){transform:rotate(.8deg)}
.ticket .face{width:46px;height:46px}
.ticket .nm{font-weight:900;font-size:14px;display:block}
.ticket .rq{font-size:12px;color:var(--ink-2);display:block}
.stamp{position:absolute;right:8px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--lac);color:var(--lac);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;transform:rotate(-10deg)}
.hint{margin:2px 0 10px;font-size:12px;color:var(--ink-2)}

.seat{display:flex;flex-direction:column;gap:6px;padding:8px 0 10px;border-bottom:1px dashed var(--paper-2)}
.seat-h{display:flex;align-items:center;gap:8px}
.seat-h .face{width:34px;height:34px}
.seat-h b{font-weight:900;font-size:15px;flex:1}
.seat-h .sc{font-family:var(--disp);font-size:17px;color:var(--lac)}
.firstmark{font-size:10px;font-weight:900;letter-spacing:.1em;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 5px;vertical-align:middle;white-space:nowrap}
.firstmark.rank{background:#8a7a62}
.firstmark.r1{background:var(--gold);color:#2b1f14}
.res{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12px;font-weight:700;align-items:center}
.res>span{display:inline-flex;align-items:center;gap:3px}
.res .z{opacity:.4}
.meta{font-size:11.5px;color:var(--ink-2)}
.dlist{display:flex;flex-direction:column;gap:3px}
.drow{display:flex;gap:6px;font-size:12px;align-items:baseline}
.drow .dot{width:9px;height:9px;border-radius:50%;background:var(--cat);flex:none;align-self:center}
.drow .e{color:var(--ink-2);font-size:11px}
.loglist{list-style:none;margin:0;padding:6px 0 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.logi{display:flex;gap:7px;align-items:flex-start}
.logi.sys{color:var(--ink-2);font-style:italic}
.logi .lt{flex:1;min-width:0}
.lr{font-size:10px;font-weight:900;color:var(--ink-2);font-style:normal}
.dv{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;margin-left:auto}
.dv b{font-family:var(--disp);font-weight:400;font-size:14px;color:#3f6d2a}
.dv.neg b{color:var(--lac-2)}
.dv small{font-size:10px;color:var(--ink-2)}
.dv .why2{font-size:9.5px;opacity:.85;max-width:150px;text-align:right}
.lastev .dv .why2{display:none}
.dvs{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;flex:none;max-width:50%;justify-content:flex-end}
.dvx{display:flex;align-items:center;gap:3px;font-size:11px;font-style:normal;background:var(--paper-2);border-radius:999px;padding:1px 7px}
.dvx b{color:#3f6d2a}
.lastev .dv b{color:#9fe07a}.lastev .dv small{color:#d8ccb8}
.recap li .dv{margin-left:auto}
.logf{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 8px;position:sticky;top:-8px;z-index:1;background:inherit}
.logf .gbtn{min-height:36px;padding:0 10px;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #46290f}
.logf .gbtn.on{box-shadow:0 3px 0 var(--indigo-2)}
.logf .face{width:22px;height:22px}
.logtext{width:100%;min-height:300px;height:50vh;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--paper-2);border-radius:8px;padding:8px;background:#fffdf7;color:var(--ink);resize:none}
.sorders{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.sol{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);width:100%}
.sord{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:8px;background:var(--paper-2);border-left:3px solid var(--cat);font-size:12px}
.sord.ok{box-shadow:inset 0 0 0 2px #6d9a4a}
.sord img{width:34px;height:34px;object-fit:contain}
.sord>span{display:flex;flex-direction:column}
.sord .cost{display:flex;gap:1px;margin-top:1px}
.logi .ld{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none;margin-top:5px}
.rules p,.rules li{font-size:13px;margin:0}
.rules p{margin-top:6px}
.rules h3{font-family:var(--disp);font-weight:400;font-size:14px;margin:12px 0 4px}
.rules ol,.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.newrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* your counter */
.tray{flex:none;background:linear-gradient(rgba(50,25,8,.12),rgba(50,25,8,.12)),url(art/tex-oak.webp) 0 0/900px auto repeat,linear-gradient(#a87b45,#8b6033);box-shadow:inset 0 4px 0 rgba(255,255,255,.18),0 -6px 14px rgba(0,0,0,.25);color:#fff7e8}
.tray .in{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"pantry orders regs plates" "pantry orders regs me";grid-template-rows:auto 1fr;gap:6px 18px;align-items:start;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tlabel{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#f3dcb5}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.bowls{display:grid;grid-template-columns:repeat(4,46px);gap:8px 6px}
.bowl{height:46px;border-radius:50%;background:radial-gradient(circle,#fbf5e9 0 55%,#d9cbb1 56% 62%,#f4ead8 63%);box-shadow:0 3px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;position:relative}

.slip{flex:0 0 120px;border:2px dashed rgba(255,247,232,.4);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#f3dcb5;text-align:center;padding:6px}
.stacks{display:flex;gap:10px;align-items:flex-end}
.stack{display:flex;flex-direction:column-reverse;align-items:center;width:46px}
.stack .pl{width:42px;height:9px;border-radius:50%;background:var(--cat);border:2px solid #fffdf8;margin-top:-4px;box-shadow:0 2px 0 rgba(0,0,0,.25)}

.stack .cnt{font-family:var(--disp);font-size:14px;margin-top:4px}
.stack .lb{font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#f3dcb5}
.sets{font-size:11.5px;color:#f3dcb5}
.sets b{color:#fff;font-family:var(--disp);font-weight:400}
.t-pantry{grid-area:pantry}.t-orders{grid-area:orders}.t-regs{grid-area:regs}.t-plates{grid-area:plates}.t-me{grid-area:me}
.t-me{flex-direction:row;align-items:center}
.chefs{display:flex;gap:2px;min-height:30px;align-items:flex-end}
.chefs .face{width:28px;height:28px}
.chefs.ready .face{width:40px;height:40px;cursor:grab;touch-action:none;box-shadow:0 0 0 2px #ffd27a,0 4px 8px rgba(0,0,0,.35);animation:bob 1.8s ease-in-out infinite}
.chefs.ready .face:nth-child(2){animation-delay:.2s}.chefs.ready .face:nth-child(3){animation-delay:.4s}.chefs.ready .face:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.t-me{gap:10px}
.myab{display:flex;flex-direction:column;font-size:11px;line-height:1.25;color:#f3dcb5;max-width:150px}
.myab b{color:#ffd27a;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.dragghost{position:fixed;left:0;top:0;width:56px;height:56px;z-index:60;pointer-events:none;box-shadow:0 0 0 3px #ffd27a,0 14px 24px rgba(0,0,0,.45);transition:transform .05s linear}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
body.dragging .board:not(.can){opacity:.45}
.board.drop{transform:scale(1.04);border-color:#ffd27a!important;box-shadow:0 4px 0 var(--wood-dk),0 0 0 5px #ffd27a,0 12px 22px rgba(0,0,0,.35)!important}
.bslot.tap{cursor:pointer}
.bslot.tap:hover .plate,.bslot.tap:focus-visible .plate{transform:translateY(-3px)}
.hanko.bump{animation:hbump .5s ease infinite alternate}
@keyframes hbump{to{transform:rotate(-8deg) scale(1.18)}}
.stack{position:relative}
.stack.bump .pl:last-of-type{animation:drop .6s cubic-bezier(.2,1.5,.4,1) both}
.stack.bump .cnt{animation:hbump2 .5s ease 3 alternate;color:#ffd27a}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
@keyframes hbump2{to{transform:scale(1.5)}}
.stack .plus{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:var(--disp);color:#ffd27a;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.4);animation:rise 1.5s ease both;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.servefx{background:radial-gradient(closest-side,rgba(20,14,9,.55),rgba(20,14,9,.2));cursor:pointer}
.sfx-card{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;position:relative}
.sfx-k{font-family:var(--disp);font-size:15px;letter-spacing:.06em;color:#ffd27a;background:#1b140e;border:2px solid #ffd27a;border-radius:999px;padding:4px 16px}

.sfx-plates{display:flex;gap:10px}

.sfx-plate .plate{width:120px;height:120px}
@keyframes slam{from{transform:translateY(-90px) scale(1.3) rotate(-12deg);opacity:0}}
.sfx-card h2{margin:0;font-family:var(--disp);font-weight:400;font-size:22px;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.sfx-card p{margin:0;font-weight:700;color:#ffe9c4;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.sfx-vp{font-family:var(--disp);font-size:40px;line-height:1;color:#fff;background:var(--lac);border-radius:14px;padding:6px 16px 8px;box-shadow:0 5px 0 var(--lac-2),0 12px 30px rgba(0,0,0,.4);animation:stamp .5s .35s cubic-bezier(.2,1.6,.4,1) both}
.sfx-vp small{font-size:14px;margin-left:4px}
.car{flex:1;min-width:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}

.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 0}
.cdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.cdot.on{background:rgba(255,255,255,.85)}
.cveil{padding:0}
.deck{position:relative;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:stretch}
.deck .car{width:100%}
.deck .cslide{padding:8px 0;align-items:center}
.pcard2{text-align:left}
.seatcard .pcb,.pcard2.wide .pcb{align-items:stretch}

.pch{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 14px;flex:none}

.pcb{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:4px 16px 16px;display:flex;flex-direction:column;align-items:center}

.schead{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px}

.schead h3{margin:0;font-family:var(--disp);font-weight:400;font-size:20px}
.sgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;width:100%;font-size:12.5px;align-items:center;margin-bottom:6px}
.sl{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.seatcard .res{display:flex;flex-wrap:wrap;gap:8px}
.seatcard .echips{justify-content:flex-start}

.cdish .plate{width:128px;height:128px}
.cmeta{display:flex;gap:6px;align-items:center}
.cct,.ctag{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff;background:var(--cat)}
.ctag{background:var(--indigo)}.ctag.last{background:var(--lac)}

.ccost{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(15,10,6,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:url(art/tex-paper.webp) 0 0/320px,var(--paper);color:var(--ink);border-radius:14px;max-width:700px;width:100%;max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 8px 0 var(--paper-2),0 24px 60px rgba(0,0,0,.5);border-top:8px solid var(--lac);overflow:hidden}

.gbtn.wood{background:linear-gradient(#8f6436,#6b4520);color:#fff;box-shadow:0 4px 0 #46290f}
.gbtn.on{background:var(--indigo);box-shadow:0 4px 0 var(--indigo-2)}
.welcome{position:fixed;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(90% 60% at 50% 20%,rgba(33,56,91,.55),rgba(20,14,9,.92)),url(art/tex-noren.webp) 0 0/420px,var(--indigo)}
.wcard{width:100%;max-width:440px;max-height:100%;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;text-align:center;padding:8px 2px}
.wcard::-webkit-scrollbar{display:none}

.wtag{margin:0;color:#e5dccb;max-width:32ch}
.wchefs{display:flex;justify-content:center}

.wchefs .face:nth-child(2){width:78px;height:78px;z-index:1;margin-top:-10px}
.gbtn.wbig{width:100%;min-height:58px;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 16px}
.gbtn.wbig small{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:12px;font-weight:700;opacity:.85}
.wnew{width:100%;display:flex;flex-direction:column;gap:12px;background:rgba(27,20,14,.72);border:2px solid rgba(255,210,122,.35);border-radius:14px;padding:14px}
.wnew h2{margin:0;font-family:var(--disp);font-weight:400;font-size:17px;color:#ffd27a}
.wrow{display:flex;align-items:center;gap:10px}
.wl{flex:0 0 76px;text-align:left;font-weight:900;font-size:13px;color:#e5dccb}
.seg{flex:1;display:flex;gap:8px}
.seg .gbtn{flex:1;padding:0 6px;min-height:44px;font-size:14px}
.wdesc{margin:-2px 0 0;font-size:13px;color:#e5dccb;min-height:2.8em}
.wlink{border:0;background:transparent;color:#ffd27a;font-weight:900;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 12px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px;padding-top:6px}

.pick-ice{justify-content:flex-start}

.fbtn .fl{background:var(--indigo);color:#fff;border-radius:999px;padding:2px 9px}
.fbtn.sel .fl{background:var(--lac)}
.recap li.tip{font-weight:700}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 0}

/* short screens: give the stations more room */
@media (min-width:641px) and (max-height:860px){
  .beltzone{padding-top:14px}
  .track{padding:10px 10px 8px}
  .plate,.bempty{width:84px;height:84px}
  .belt .plabel .ab{display:none}
  .table{margin-top:12px}
  .table>.in{padding-top:10px;padding-bottom:10px}
  .board{min-height:104px;padding:8px 9px 8px}
  .board .bt{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .orders{padding-top:10px}
  .oticket{padding:10px 9px 7px}
  .oticket .thumb{width:46px;height:34px}
  .tray .in{padding-top:10px;padding-bottom:10px}
}
/* rival turns, events and celebrations */
.table{position:relative}
.actbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;max-width:min(580px,calc(100% - 24px));background:rgba(27,20,14,.93);color:#fff;border-radius:999px;padding:5px 16px 5px 5px;box-shadow:0 6px 18px rgba(0,0,0,.35);border:2px solid var(--pc);font-size:13px;animation:slidein .35s ease both;pointer-events:none}
.actbar .face{width:32px;height:32px}
.actbar.mv{padding:6px 16px 6px 6px;font-size:14px;align-items:center;animation:mvin .35s ease both;min-width:min(360px,calc(100% - 24px))}
@keyframes mvin{from{opacity:0;margin-top:-12px}}
.mvt{flex:1;min-width:0}
@media (max-width:640px){.actbar.mv{left:10px;right:10px;transform:none;max-width:none;min-width:0;border-radius:16px;font-size:13px}}
.actbar.mv .face{width:40px;height:40px}
.mvst{width:30px;height:30px;flex:none;animation:hop .9s ease-in-out infinite}
.actbar.done .mvst{animation:none}
@keyframes hop{50%{transform:translateY(-4px)}}

const marketCount=(s,p)=>Math.min(2+abCount(p,'market')+(s.event==='auction'?1:0),s.market.length);
const pantryCount=(s,p)=>Math.max(1,2+abCount(p,'pantry')-(s.event==='shortage'?1:0));

function abText(ab){
  if(!ab) return '';
  switch(ab.t){
    case 'start': return 'Each round: +1 '+(ab.g==='F'?'fish from the deck':ab.g==='W'?'wasabi':ING_NAME[ab.g])+'.';
    case 'market': return 'Fish Market: +1 fish.';
    case 'pantry': return 'Pantry: +1 staple.';
    case 'belt': return 'Kaiten Belt: +1 wasabi.';
    case 'cook': return '+2 VP each time you serve another '+CAT_NAME[ab.c]+'.';
    case 'end': return 'Game end: +1 VP per '+CAT_NAME[ab.c]+' served.';
    case 'now': return 'When served: +'+ab.w+' wasabi.';
    case 'regular': return 'Game end: +2 VP per regular won.';
  }

function reqText(r){
  const q=r.req;
  if(q.cat){const e=Object.entries(q.cat); if(e.length===4) return 'One of each type'; return e.map(([k,v])=>v+' '+CAT_NAME[k]).join(' + ');}

  if(q.total) return q.total+' dishes of any type';

function rnd(s){
  s.rng=(s.rng+0x6D2B79F5)|0; let t=s.rng;

  return ((t^(t>>>14))>>>0)/4294967296;

  if(!s.fishDeck.length){if(!s.fishDiscard.length) return null; s.fishDeck=shuffle(s,s.fishDiscard); s.fishDiscard=[];}

  if(!s.dishDeck.length){if(!s.dishDiscard.length) return null; s.dishDeck=shuffle(s,s.dishDiscard); s.dishDiscard=[];}

}

function newGame(opts){
  const o=Object.assign({nBots:2,seed:(Math.random()*1e9)|0,allBots:false,level:'normal',levels:null,catchup:true,you:null,chars:null,rules:null},opts||{});

const chefsOf=p=>3+(p.apprentice?1:0);
const chefsLeft=p=>chefsOf(p)-p.placed;
function countCost(cost){const c={R:0,N:0,T:0,S:0,U:0,E:0}; for(const ch of cost) c[ch]++; return c;}
function shortfall(hand,d){const n=countCost(d.cost); let sh=0; for(const k in n) sh+=Math.max(0,n[k]-hand[k]); return sh;}

function canCookAll(p,ds){
  const h={...p.hand}; let w=p.wasabi;
  for(const d of ds){const n=needOf(p,d,h); for(const k in n){const u=Math.min(n[k],h[k]); h[k]-=u; w-=n[k]-u;} if(w<0) return false;}
  return true;
}
function missingList(p,d){const n=needOf(p,d,p.hand); const out=[]; for(const k of ING_KEYS){const m=n[k]-p.hand[k]; for(let i=0;i<m;i++) out.push(k);} return out;}
function catCounts(tab){const c={nigiri:0,maki:0,sashimi:0,special:0}; tab.forEach(id=>c[DISH[id].cat]++); return c;}
function regMet(r,tab){
  const q=r.req;
  if(q.cat){const c=catCounts(tab); return Object.entries(q.cat).every(([k,v])=>c[k]>=v);}
  if(q.fish) return tab.filter(id=>DISH[id].cost.includes(q.fish)).length>=q.n;
  if(q.total) return tab.length>=q.total;
  if(q.allFish) return FISH.every(f=>tab.some(id=>DISH[id].cost.includes(f)));
  return false;
}
// house rules: whole groups of bonuses can be switched off for newcomers. They live on each player too, so score(p) can see them.
const RULE_OF={start:'start',market:'station',pantry:'station',belt:'station',cook:'dish',end:'dish',now:'dish',regular:'dish'};
const RULES_ALL={dish:true,station:true,start:true,chefs:true};
const abOn=(p,a)=>!!a&&(!p.rules||p.rules[RULE_OF[a.t]]!==false);
const abOf=(p,id)=>abOn(p,DISH[id].ab)?DISH[id].ab:null;
const chefOn=p=>!!(p.char&&(!p.rules||p.rules.chefs!==false));
const abCount=(p,t)=>p.tableau.filter(id=>{const a=abOf(p,id); return a&&a.t===t;}).length+(chefOn(p)&&CHAR[p.char].t===t?CHAR[p.char].n||1:0);

// a power cut halves the belt: one chef can work it by hand
const locCap=(s,loc)=>loc==='belt'&&s.event==='powercut'?1:LOC[loc].cap(s.players.length);
function spotFree(s,loc){return s.spots[loc].length<locCap(s,loc);}
function whyNot(s,pi,loc){
  const p=s.players[pi];
  if(!spotFree(s,loc)) return 'Taken';
  switch(loc){
    case 'market': return s.market.length?'':'The ice is empty';
    case 'belt': if(p.orders.length>=ORDER_LIMIT) return 'Your order clips are full'; return s.belt.some(Boolean)?'':'The belt is empty';
    case 'prep': case 'head': return p.orders.some(id=>canCook(p,DISH[id]))?'':'Nothing ready to cook';
    case 'staff': return s.round>=s.maxRounds?'No rounds left to use them':p.hired?'Already hired':p.wasabi<HIRE_COST?'Needs '+HIRE_COST+' wasabi':'';
  }
  return '';
}
const legal=(s,pi,loc)=>!whyNot(s,pi,loc);
// closing time: every 3 leftover ingredients (not wasabi) score 1 VP; every order still held costs 1 VP
const LEFTOVER_PER_VP=3;
// the belt's far-right spot: its dish leaves at round end, and whoever takes it cooks it with one ingredient less
const LAST_LAP=4;
// how many dishes a chef may take at the belt
const beltRoom=(s,p)=>Math.min(2,ORDER_LIMIT-p.orders.length);

function cook(s,pi,id){
  const p=s.players[pi], d=DISH[id], n=needOf(p,d,p.hand), bargain=isBargain(p,d);
  for(const k in n){const u=Math.min(n[k],p.hand[k]); p.hand[k]-=u; if(FISH.includes(k)) for(let i=0;i<u;i++) s.fishDiscard.push(k); p.wasabi-=n[k]-u;}
  p.orders.splice(p.orders.indexOf(id),1);
  if(bargain) p.bargain=p.bargain.filter(x=>x!==id);
  const trig=p.tableau.filter(t=>{const a=abOf(p,t); return a&&a.t==='cook'&&a.c===d.cat;}).length;
  p.bonus+=2*trig; p.tableau.push(id);
  if(abOn(p,d.ab)&&d.ab.t==='now') p.wasabi+=d.ab.w;
  let first=0; if(chefOn(p)&&CHAR[p.char].t==='first'&&p.firstR!==s.round){p.firstR=s.round; first=1; p.bonus+=1;}
  let ev=0;
  if(s.event==='blogger') ev+=1;
  if(s.event==='celebrity'&&d.cat==='special'&&!s.celebDone){s.celebDone=true; ev+=3;}
  p.ev+=ev;
  log(s,p.name+' served '+d.name+' ('+d.vp+' VP'+(trig?', +'+2*trig+' bonus':'')+(first?', +1 old master':'')+(ev?', +'+ev+' event':'')+').',pi,'serve');
}

function act(s,pi,loc,args){
  args=args||{};
  if(s.over||s.turn!==pi) throw new Error('Not your turn');
  if(!legal(s,pi,loc)) throw new Error('Illegal: '+loc);
  const p=s.players[pi];
  s.spots[loc].push(pi); p.placed++;
  switch(loc){
    case 'market':{
      const k=marketCount(s,p);
      const picks=[...new Set(args.picks||[])].filter(i=>i>=0&&i<s.market.length).slice(0,k);
      while(picks.length<k){for(let i=0;i<s.market.length;i++) if(!picks.includes(i)){picks.push(i);break;}}
      const got=picks.map(i=>s.market[i]);
      s.market=s.market.filter((_,i)=>!picks.includes(i));
      got.forEach(f=>p.hand[f]++); refillMarket(s);
      log(s,p.name+' bought '+got.map(f=>ING_NAME[f]).join(', ')+' at the market.',pi);
      break;}
    case 'pantry':{
      const k=pantryCount(s,p); const r=Math.max(0,Math.min(k,args.rice==null?k:args.rice));
      p.hand.R+=r; p.hand.N+=k-r;
      const rw=chefOn(p)&&CHAR[p.char].t==='pantryw'?1:0; p.wasabi+=rw;
      log(s,p.name+' took '+[r?r+' Rice':'',k-r?(k-r)+' Nori':''].filter(Boolean).join(' and ')+' from the pantry'+(rw?' and 1 wasabi':'')+'.',pi);
      break;}
    case 'belt':{
      const cut=s.event==='powercut', room=beltRoom(s,p);
      const slots=[...new Set(args.slots||[])].filter(i=>s.belt[i]).slice(0,room);
      if(!slots.length) slots.push(s.belt.findIndex(Boolean));
      let w=abCount(p,'belt'); const names=[];
      if(!s.taken) s.taken={};
      slots.forEach(i=>{const b=s.belt[i]; p.orders.push(b.id); if(!cut) w+=b.w; names.push(DISH[b.id].name+(i===LAST_LAP?' (last-lap bargain: 1 ingredient less)':'')); if(i===LAST_LAP) (p.bargain=p.bargain||[]).push(b.id); s.belt[i]=null; s.taken[i]=pi;});
      p.wasabi+=w;
      log(s,p.name+' took '+names.join(' and ')+' off the '+(cut?'stopped ':'')+'belt'+(w?' with '+w+' wasabi':'')+'.',pi);
      break;}
    case 'prep':{
      let id=args.dish; if(!p.orders.includes(id)||!canCook(p,DISH[id])) id=p.orders.find(x=>canCook(p,DISH[x]));
      cook(s,pi,id); break;}
    case 'head':{
      let ids=(args.dishes||[]).filter(x=>p.orders.includes(x)).slice(0,2);
      if(!ids.length||!canCookAll(p,ids.map(x=>DISH[x]))) ids=[p.orders.find(x=>canCook(p,DISH[x]))];
      ids.forEach(id=>cook(s,pi,id)); break;}
    case 'door':{
      s.doorTaker=pi; p.wasabi+=1+abCount(p,'door');
      let drew=''; if(p.orders.length<ORDER_LIMIT&&s.round<s.maxRounds){const id=drawDish(s); if(id){p.orders.push(id); drew=' and drew an order';}}
      log(s,p.name+' opened the front door: first next round, +'+(1+abCount(p,'door'))+' wasabi'+drew+'.',pi);
      break;}
    case 'staff':{
      p.hired=true; p.wasabi-=HIRE_COST; log(s,p.name+' paid '+HIRE_COST+' wasabi and hired an apprentice.',pi); break;}
  }
  claimRegular(s,pi);
  advance(s);
}

function claimRegular(s,pi){
  const p=s.players[pi];
  for(let i=0;i<s.regulars.length;i++){
    const r=s.regulars[i];
    if(r&&regMet(REG[r],p.tableau)){
      p.regulars.push(r); s.regulars[i]=s.regDeck.pop()||null;
      log(s,p.name+' won over the '+REG[r].name+' (+'+REG[r].vp+' VP).',pi,'regular:'+r);
      return;
    }
  }
}
function advance(s){
  const n=s.players.length;
  for(let k=1;k<=n;k++){const j=(s.turn+k)%n; if(chefsLeft(s.players[j])>0){s.turn=j; return;}}
  endRound(s);
}
function endRound(s){
  let nb;
  if(s.event==='powercut'){
    // power cut: the belt stays put; empty spots are filled by hand, nothing leaves, no wasabi
    let added=0; for(let i=0;i<5;i++) if(!s.belt[i]){const id=drawDish(s); if(id){s.belt[i]={id,w:0}; added++;}}
    nb=s.belt;
    if(s.round<s.maxRounds) log(s,'The belt stays put after the power cut'+(added?': '+added+' new dish'+(added>1?'es':'')+' placed by hand.':'.'));
  } else {
  // the belt turns: the oldest dish goes round the corner, the rest slide along and pick up wasabi
  const gone=s.belt[4]; if(gone){s.dishDiscard.push(gone.id); log(s,DISH[gone.id].name+' went round the corner.');}
  const rest=s.belt.slice(0,4).filter(Boolean);
  nb=[null,null,null,null,null]; rest.forEach((b,i)=>{b.w++; nb[5-rest.length+i]=b;});
  let added=0; for(let i=0;i<5;i++) if(!nb[i]){const id=drawDish(s); if(id){nb[i]={id,w:0}; added++;}}
  if(s.round<s.maxRounds) log(s,'The belt turns: '+(added===1?'1 new dish arrives':added+' new dishes arrive')+' and the rest pick up a wasabi.');
  }
  s.belt=nb; s.taken={};
  LOCS.forEach(l=>s.spots[l.id]=[]);
  s.players.forEach(p=>{p.placed=0; if(p.hired) p.apprentice=true;});
  if(s.doorTaker!=null){s.first=s.doorTaker; s.doorTaker=null;}
  else if(s.catchup){
    // catch-up: with nobody at the Front Door, the chef furthest behind goes first
    const n=s.players.length; let best=null;
    for(let k=1;k<=n;k++){const j=(s.first+k)%n, t=score(s.players[j]).total; if(best===null||t<best.t) best={j,t};}
    s.first=best.j;
  } else s.first=(s.first+1)%s.players.length;
  s.round++; s.event=null; s.celebDone=false;
  if(s.round>s.maxRounds){
    s.over=true; s.round=s.maxRounds;
    s.players.forEach((p,i)=>{
      const stock=ING_KEYS.reduce((a,k)=>a+p.hand[k],0);
      p.fin={left:Math.floor(stock/LEFTOVER_PER_VP),orders:p.orders.length};
      const you=!p.bot&&p.name==='You';
      if(p.fin.left||p.fin.orders) log(s,'Closing: '+p.name+(p.fin.left?(you?' score ':' scores ')+p.fin.left+' VP for '+stock+' leftover ingredients':'')+(p.fin.left&&p.fin.orders?' and':'')+(p.fin.orders?(you?' lose ':' loses ')+p.fin.orders+' VP for '+p.fin.orders+' unserved order'+(p.fin.orders>1?'s':''):'')+'.',i,'final');
    });
    log(s,'Closing time. Final scores are in.'); return;
  }
  s.turn=s.first;
  if(EVENT_ROUNDS.includes(s.round)&&s.eventDeck.length) startEvent(s,s.eventDeck.pop());
  log(s,'Round '+s.round+' begins. '+s.players[s.first].name+(s.players[s.first].bot?' goes':' go')+' first.');
  // the morning delivery: catch-up tips and every "each round" dish, kept for the round-start card
  s.morning={round:s.round,gains:s.players.map(()=>({R:0,N:0,W:0,F:[],tip:0}))};
  if(s.catchup){
    // catch-up: regulars tip the chefs who are falling behind
    const tot=s.players.map(p=>score(p).total), lead=Math.max(...tot);
    s.players.forEach((p,i)=>{const gap=lead-tot[i]; const tip=gap>=15?2:gap>=6?1:0;
      if(tip){p.wasabi+=tip; s.morning.gains[i].tip=tip; log(s,'Regulars tip '+(p.bot?p.name:'you')+' '+tip+' wasabi to help '+(p.bot?'them':'you')+' catch up.',i,'tip');}});
  }
  s.players.forEach((p,i)=>{
    const g=s.morning.gains[i];
    p.tableau.forEach(id=>{
      const a=abOf(p,id); if(!a||a.t!=='start') return;
      if(a.g==='W'){p.wasabi++; g.W++;} else if(a.g==='F'){const f=drawFish(s); if(f){p.hand[f]++; g.F.push(f);}} else {p.hand[a.g]++; g[a.g]++;}
    });
    const parts=[g.R?g.R+' Rice':'',g.N?g.N+' Nori':'',g.W?g.W+' wasabi':'',...g.F.map(f=>'a '+ING_NAME[f])].filter(Boolean);
    if(parts.length) log(s,'Morning delivery: '+(p.bot?p.name+' gets ':'you get ')+(parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts[0])+'.',i,'morning');
  });
}

// everything a chef's counter does for them, from served dishes and their chef: the engine
function engineOf(p){
  const e={R:0,N:0,W:0,F:0,market:0,pantry:0,belt:0,door:0,pantryw:0,first:0,cook:{nigiri:0,maki:0,sashimi:0},end:{nigiri:0,maki:0,sashimi:0},reg:0};
  p.tableau.forEach(id=>{const a=abOf(p,id); if(!a) return;
    if(a.t==='start') e[a.g]++; else if(a.t==='market'||a.t==='pantry'||a.t==='belt') e[a.t]++;
    else if(a.t==='cook') e.cook[a.c]+=2; else if(a.t==='end') e.end[a.c]++; else if(a.t==='regular') e.reg+=2;});
  const c=chefOn(p)&&CHAR[p.char];
  if(c){if(c.t==='market'||c.t==='pantry'||c.t==='belt'||c.t==='door') e[c.t]+=c.n||1; if(c.t==='pantryw') e.pantryw++; if(c.t==='first') e.first++;}
  return e;
}

function startEvent(s,id){
  s.event=id; const e=EVT[id];
  log(s,'Event: '+e.name+'. '+e.text,-1,'event');
  if(id==='matsuri') s.players.forEach(p=>p.wasabi++);
  if(id==='inspect') s.players.forEach(p=>{
    let fish=FISH.reduce((a,f)=>a+p.hand[f],0);
    if(fish<=4){p.ev+=1; return;}
    while(fish>4){const f=FISH.slice().sort((a,b)=>p.hand[b]-p.hand[a])[0]; p.hand[f]--; s.fishDiscard.push(f); fish--;}
  });
}

function score(p){
  const c=catCounts(p.tableau);
  const dishes=p.tableau.reduce((a,id)=>a+DISH[id].vp,0);
  const sets=Math.min(c.nigiri,c.maki,c.sashimi)*SET_VP;
  const regs=p.regulars.reduce((a,id)=>a+REG[id].vp,0);
  let end=0; p.tableau.forEach(id=>{const a=abOf(p,id); if(!a) return; if(a.t==='end') end+=c[a.c]; if(a.t==='regular') end+=2*p.regulars.length;});
  const ev=p.ev||0;
  // closing time only (p.fin is set when the game ends): leftovers score, unserved orders cost
  const left=p.fin?p.fin.left:0, unserved=p.fin?-p.fin.orders:0;
  return {dishes,bonus:p.bonus,sets,regs,end,ev,left,unserved,total:dishes+p.bonus+sets+regs+end+ev+left+unserved};
}
function ranking(s){
  return s.players.map((p,i)=>({i,sc:score(p),n:p.tableau.length,w:p.wasabi}))
    .sort((a,b)=>b.sc.total-a.sc.total||b.n-a.n||b.w-a.w);
}

/* ---------- bot ---------- */
function dishValue(s,p,d){
  const left=s.maxRounds-s.round, tab=p.tableau;
  let v=d.vp; const a=abOn(p,d.ab)?d.ab:null;
  if(a){switch(a.t){
    case 'start': v+=left*(a.g==='W'||a.g==='F'?0.9:0.6); break;
    case 'market': case 'pantry': v+=left*0.55; break;
    case 'belt': v+=left*0.45; break;
    case 'cook': v+=left*0.9; break;
    case 'end': v+=catCounts(tab)[a.c]+(a.c===d.cat?1:0)+left*0.3; break;
    case 'now': v+=a.w*0.7; break;
    case 'regular': v+=2*p.regulars.length+left*0.3; break;
  }}
  v+=2*tab.filter(t=>{const x=abOf(p,t); return x&&x.t==='cook'&&x.c===d.cat;}).length;
  if(d.cat!=='special'){const c=catCounts(tab); const m=Math.min(c.nigiri,c.maki,c.sashimi); if(c[d.cat]===m) v+=1.6;}
  const after=tab.concat([d.id]);
  for(const r of s.regulars) if(r&&!regMet(REG[r],tab)&&regMet(REG[r],after)) v+=REG[r].vp*0.9;
  return v;
}
function demand(s,p){
  const dem={R:0,N:0,T:0,S:0,U:0,E:0}; const pool={...p.hand};
  const ords=p.orders.map(id=>DISH[id]).sort((a,b)=>dishValue(s,p,b)-dishValue(s,p,a));
  ords.forEach(d=>{const n=countCost(d.cost); const wt=1+dishValue(s,p,d)/6; for(const k in n){const u=Math.min(pool[k],n[k]); pool[k]-=u; dem[k]+=(n[k]-u)*wt;}});
  return dem;
}
function botMove(s,pi){
  const p=s.players[pi], left=s.maxRounds-s.round, last=left===0;
  const lv=LEVELS[p.level]||LEVELS.normal;
  const opts=[]; const noise=()=>rnd(s)*lv.noise;
  const cookable=p.orders.filter(id=>canCook(p,DISH[id])).map(id=>({id,v:dishValue(s,p,DISH[id])})).sort((a,b)=>b.v-a.v);
  for(const L of LOCS){
    if(!legal(s,pi,L.id)) continue;
    let sc=-1, args={};
    switch(L.id){
      case 'prep': sc=cookable[0].v+0.6; args={dish:cookable[0].id}; break;
      case 'head':{
        let best=null;
        for(let i=0;i<cookable.length;i++) for(let j=i+1;j<cookable.length;j++){
          const a=cookable[i],b=cookable[j];
          if(canCookAll(p,[DISH[a.id],DISH[b.id]])&&(!best||a.v+b.v>best.v)) best={v:a.v+b.v,ids:[a.id,b.id]};
        }
        if(best){sc=best.v+1.2; args={dishes:best.ids};}
        break;}
      case 'belt':{
        const room=beltRoom(s,p), bw=b=>s.event==='powercut'?0:b.w;
        const items=s.belt.map((b,i)=>{
          if(!b) return null; const d=DISH[b.id]; const sh=Math.max(0,shortfall(p.hand,d)-(i===LAST_LAP?1:0)-p.wasabi-bw(b));
          let v=0.5*dishValue(s,p,d)/(1+0.35*sh)+0.85*bw(b);
          if(last) v=sh===0?0.7*dishValue(s,p,d)-1:-1.5;
          else if(left===1&&sh>2) v*=0.4;
          return {i,v};
        }).filter(x=>x&&x.v>0).sort((a,b)=>b.v-a.v).slice(0,room);
        if(!items.length) break;
        sc=items.reduce((a,x)=>a+x.v,0)+abCount(p,'belt')*0.8; args={slots:items.map(x=>x.i)};
        break;}
      case 'market':{
        const k=marketCount(s,p);
        const dem=demand(s,p); const picks=[]; let v=0;
        for(let t=0;t<k;t++){
          let bi=-1,bv=-1;
          s.market.forEach((f,i)=>{if(picks.includes(i)) return; const val=dem[f]>0.01?1.3+Math.min(dem[f],2)*0.2:0.35; if(val>bv){bv=val;bi=i;}});
          if(bi<0) break; picks.push(bi); v+=bv; dem[s.market[bi]]-=1;
        }
        sc=last?k/LEFTOVER_PER_VP+v*0.3:v; args={picks};
        break;}
      case 'pantry':{
        const k=pantryCount(s,p); const dem=demand(s,p); let r=0,v=0;
        for(let t=0;t<k;t++){ if(dem.R>=dem.N&&dem.R>0){r++;dem.R--;v+=1.2;} else if(dem.N>0){dem.N--;v+=1.2;} else {r++; v+=0.35;} }
        sc=(last?pantryCount(s,p)/LEFTOVER_PER_VP+v*0.3:v*0.95)+(chefOn(p)&&CHAR[p.char].t==='pantryw'?0.9:0); args={rice:r};
        break;}
      case 'door': sc=(last?0.7:1.6+(p.orders.length<ORDER_LIMIT?0.6:0))+abCount(p,'door')*0.7; break;
      case 'staff': sc=left>=2?1.1*left:-1; break;
    }
    if(sc>-1) opts.push({loc:L.id,args,sc:sc+noise()});
  }
  opts.sort((a,b)=>b.sc-a.sc);
  if(opts.length>1&&rnd(s)<lv.slip) return opts[1+Math.floor(rnd(s)*(opts.length-1))];
  return opts[0]||{loc:'pantry',args:{}};
}

if(typeof module!=='undefined') module.exports={newGame,act,botMove,score,ranking,engineOf,DISHES,REGULARS,LOCS,CHARS,chefsLeft,legal};
</script>

<script>
/* ================= UI ================= */
const DISH_ART={
  n1:'nigiri-tuna',n2:'nigiri-salmon',n3:'nigiri-eel',n4:'nigiri-shrimp',n5:'nigiri-toro',n6:'nigiri-aburi',n7:'nigiri-shrimp',n8:'nigiri-egg',n9:'nigiri-eel',n10:'nigiri-pair',
  m1:'maki-tuna',m2:'maki-salmon',m3:'maki-cucumber',m4:'uramaki',m5:'roll-dragon',m6:'maki-tuna',m7:'futomaki',m8:'roll-rainbow',m9:'maki-salmon',m10:'uramaki',
  s1:'sashimi-tuna',s2:'sashimi-salmon',s3:'sashimi-ebi',s4:'sashimi-mixed',s5:'sashimi-toro',s6:'sashimi-salmon',s7:'sashimi-mixed',s8:'sashimi-ebi',s9:'sashimi-tuna',s10:'sashimi-boat',
  x1:'bowl-chirashi',x2:'bowl-unadon',x3:'omakase',x4:'tempura',x5:'bowl-kaisen',x6:'chawanmushi',
};
// 'svg' = drawn placeholders; switch to 'webp' once tools/slice_sheets.py has cut the painted sheets
const ART_EXT='webp';
// a bonus switched off by the house rules isn't printed on the cards

// the score stamp counts up to the new total
function countVP(to){
  cancelAnimationFrame(ui.vpRaf);
  if(ui.vpShown==null||ui.vpShown>to){ui.vpShown=to; return;}
  if(ui.vpShown===to) return;
  const from=ui.vpShown, t0=performance.now(), dur=Math.min(1600,350+(to-from)*90);
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur), v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    ui.vpShown=v; const b=app.querySelector('.hanko b'); if(b) b.textContent=v;
    if(k<1) ui.vpRaf=requestAnimationFrame(step); else app.querySelector('.hanko')?.classList.remove('bump');
  };
  ui.vpRaf=requestAnimationFrame(step);
}

function regProgress(r,tab){
  const q=r.req, c=catCounts(tab);
  if(q.cat) return Object.entries(q.cat).map(([k,v])=>({label:CAT_NAME[k],have:Math.min(c[k],v),need:v,cat:k}));
  if(q.fish) return [{label:'Dishes with '+ING_NAME[q.fish],have:Math.min(tab.filter(id=>DISH[id].cost.includes(q.fish)).length,q.n),need:q.n,fish:q.fish}];
  if(q.total) return [{label:'Dishes served',have:Math.min(tab.length,q.total),need:q.total}];
  if(q.allFish) return FISH.map(f=>({label:ING_NAME[f],have:tab.some(id=>DISH[id].cost.includes(f))?1:0,need:1,fish:f}));
  return [];
}

function hcShow(t){

const SND={ctx:null,on:true,music:true,quick:false,idx:4};
try{const o=JSON.parse(localStorage.getItem('kaiten-sound')||'{}'); SND.on=o.on!==false; SND.music=o.music!==false; SND.quick=!!o.quick;}catch(e){}

// miyako-bushi scale on D: D Eb G A Bb
const SCALE=[293.66,311.13,392,440,466.16,587.33,622.25,783.99,880];
function audioInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended') SND.ctx.resume(); return;}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=new AC(); SND.ctx=c;
  SND.sfx=c.createGain(); SND.sfx.gain.value=SND.on?0.6:0; SND.sfx.connect(c.destination);
  SND.bg=c.createGain(); SND.bg.gain.value=SND.music?1:0; SND.bg.connect(c.destination);
  SND.next=c.currentTime+0.4; SND.step=0;
  setInterval(musicTick,150);
}
function tone(f,t,dur,vol,type,dest,f2){
  const c=SND.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur*0.8);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||SND.sfx); o.start(t); o.stop(t+dur+0.05);
}
function pluck(f,t,vol,dest){
  // koto-ish: bright triangle with an octave partial, filter closing as it rings
  const c=SND.ctx, lp=c.createBiquadFilter(), g=c.createGain();
  lp.type='lowpass'; lp.frequency.setValueAtTime(f*9,t); lp.frequency.exponentialRampToValueAtTime(f*1.6,t+0.9);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+1.9);
  [[f,'triangle',1],[f*2.005,'sine',0.35]].forEach(([fr,ty,v])=>{const o=c.createOscillator(), og=c.createGain(); o.type=ty; o.frequency.value=fr; og.gain.value=v; o.connect(og); og.connect(lp); o.start(t); o.stop(t+2);});
  lp.connect(g); g.connect(dest||SND.sfx);
}
function noise(t,dur,vol,freq,q,dest,f2){
  const c=SND.ctx, n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(freq,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur); f.Q.value=q;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest||SND.sfx); s.start(t);
}
const clink=(t,dest,vol)=>{tone(2500+Math.random()*1800,t,0.3,vol,'sine',dest); tone(5400+Math.random()*900,t+0.005,0.14,vol*0.5,'sine',dest);};
function musicTick(){
  const c=SND.ctx; if(!c) return;
  while(SND.next<c.currentTime+0.7){
    const t=SND.next, b=SND.step++;
    if(b%16===0) pluck(SCALE[0]/2,t,0.05,SND.bg);
    if(b%16===8) pluck(SCALE[2]/2,t,0.04,SND.bg);
    if(Math.random()<0.6){
      SND.idx=Math.max(0,Math.min(SCALE.length-1,SND.idx+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
      pluck(SCALE[SND.idx],t+Math.random()*0.02,0.03+Math.random()*0.02,SND.bg);
      if(Math.random()<0.12) pluck(SCALE[Math.max(0,SND.idx-2)],t+0.07,0.02,SND.bg);
    }
    SND.next+=b%8===7?0.9:0.45;
  }
}
const SFX={
  place(t){tone(820,t,0.14,0.35,'sine',null,560); noise(t,0.04,0.12,2400,1.2);},
  rival(t){tone(640,t,0.12,0.16,'sine',null,460);},
  pick(t){tone(980,t,0.09,0.12,'triangle');},
  serve(t){tone(1318.5,t,1.3,0.16); tone(1975.5,t+0.05,1.1,0.1); clink(t+0.02,SND.sfx,0.06);},
  belt(t){noise(t,0.9,0.12,300,0.9,null,1400); tone(196,t,0.5,0.06,'triangle');},
  gong(t){[[98,3.6,0.32],[147,3,0.14],[223,2.4,0.1],[331,1.6,0.05]].forEach(([f,d,v])=>tone(f,t,d,v)); noise(t,0.25,0.1,180,1);},
  fanfare(t){tone(78,t,0.7,0.6,'sine',null,44); noise(t,0.12,0.25,150,0.8);
    [0,2,3,4,5,7,8].forEach((n,i)=>pluck(SCALE[n],t+0.12+i*0.085,0.16));
    tone(1318.5,t+0.8,1.6,0.14); tone(1975.5,t+0.85,1.4,0.1); tone(78,t+0.8,0.6,0.4,'sine',null,50);},
};
function sfx(name){if(!SND.ctx||!SND.on) return; try{SFX[name](SND.ctx.currentTime+0.01);}catch(e){}}
function setGains(){if(!SND.ctx) return; SND.sfx.gain.value=SND.on?0.6:0; SND.bg.gain.value=SND.music?1:0;}

/* ----- flow ----- */
function flash(t){ui.toast=t; clearTimeout(ui.toastT); ui.toastT=setTimeout(()=>{ui.toast=''; render();},2000);}
function doAct(pi,loc,args){
  const before=S.logN||0, r=S.round, sc0=S.players.map(p=>score(p)); act(S,pi,loc,args);
  const fresh=S.log.filter(l=>l.id>before).reverse();
  // note how each chef's score moved on that chef's newest line, so the log shows where points come from
  // a score change lands on that chef's newest line, or on the event/round line that caused it (e.g. an inspection)
  S.players.forEach((p,j)=>{
    const c=score(p); let d=c.total-sc0[j].total; if(!d) return;
    // closing-time leftovers and unserved orders go on their own closing line
    const fin=fresh.find(x=>x.pi===j&&x.k==='final');
    if(fin){const fd=c.left+c.unserved; fin.dv=fd; fin.tot=c.total; fin.why=[c.left?'leftovers +'+c.left:'',c.unserved?'unserved orders '+c.unserved:''].filter(Boolean).join(', '); d-=fd; if(!d) return;}
    // points from an event that started during this move (e.g. the inspection) go on the event line
    const evl=fresh.filter(x=>x.k==='event').pop(), evd=evl?c.ev-sc0[j].ev:0;
    if(evd){(evl.dvs=evl.dvs||[]).push({pi:j,d:evd,tot:c.total,why:'events +'+evd}); d-=evd; if(!d) return;}
    const parts=SCORE_PARTS.filter(([k])=>!(fin&&(k==='left'||k==='unserved'))&&!(evd&&k==='ev')&&c[k]!==sc0[j][k]).map(([k,n])=>n+' '+(c[k]>sc0[j][k]?'+':'')+(c[k]-sc0[j][k]));
    // round-start lines (morning delivery, tips) never earn points themselves
    const l=fresh.filter(x=>x.pi===j&&x.k!=='final'&&x.k!=='morning'&&x.k!=='tip').pop();
    if(l){l.dv=d; l.tot=c.total-(fin?fin.dv:0); l.why=parts.join(', ');}
    else {const e=fresh.filter(x=>x.k==='event').pop()||fresh.filter(x=>x.pi<0).pop()||fresh[fresh.length-1]; if(e) (e.dvs=e.dvs||[]).push({pi:j,d,tot:c.total,why:parts.join(', ')});}
  });
  fresh.forEach(l=>{
    if(l.k==='serve') sfx('serve');
    if(l.k.startsWith('regular:')&&l.pi===0){ui.queue.push({type:'regular',r:l.k.slice(8)}); sfx('fanfare');}
    else if(l.k.startsWith('regular:')) ui.queue.push({type:'lostreg',r:l.k.slice(8),pi:l.pi});
    if((l.k==='morning'||l.k==='tip')&&S.morning&&!ui.queue.some(q=>q.type==='morning'&&q.round===S.morning.round)) ui.queue.push({type:'morning',round:S.morning.round,gains:JSON.parse(JSON.stringify(S.morning.gains))});
    if(l.k==='event'){ui.queue.push({type:'event',id:S.event}); setTimeout(()=>sfx('gong'),350);}
  });
  if(S.over){ui.endOpen=true; ui.sheet=null; sfx('fanfare');}
  else if(S.round!==r){flash('Round '+S.round+' · the belt turns'); sfx('belt');}
  return fresh;
}

const STATION_PHRASE={market:'the Fish Market',pantry:'the Pantry',belt:'the Kaiten Belt',prep:'the Prep Counter',head:'the Head Chef’s station',door:'the Front Door',staff:'the Staff Room'};
const andList=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function botIntent(){
  const pi=S.turn, m=botMove(S,pi);

function botResolve(){
  const sp=ui.spot, pi=sp.pi, p=S.players[pi], m=sp.m;
  const h0={...p.hand}, w0=p.wasabi, o0=p.orders.slice(), t0=p.tableau.length, v0=score(p).total;
  const fresh=doAct(pi,m.loc,m.args);
  const got=[]; ING_KEYS.forEach(k=>{for(let i=0;i<p.hand[k]-h0[k];i++) got.push(k);});
  const took=p.orders.filter(id=>!o0.includes(id)), served=p.tableau.slice(t0), dw=p.wasabi-w0, dv=score(p).total-v0;
  const won=fresh.filter(l=>l.pi===pi&&l.k.startsWith('regular:')).map(l=>REG[l.k.slice(8)].name);
  let what;
  switch(m.loc){
    case 'market': what='buys '+andList(got.filter(k=>FISH.includes(k)).map(k=>ING_NAME[k])); break;
    case 'pantry': {const r=got.filter(k=>k==='R').length, n=got.filter(k=>k==='N').length; what='takes '+andList([r?r+' Rice':'',n?n+' Nori':''].filter(Boolean)); break;}
    case 'belt': what='grabs '+andList(took.map(id=>DISH[id].name))+' off the belt'; break;
    case 'prep': case 'head': what='serves '+andList(served.map(id=>DISH[id].name)); break;
    case 'door': what='opens the front door and will go first next round'; break;
    case 'staff': what='hires an apprentice for next round'; break;
  }
  if(won.length) what+=', and wins over the '+won[0]+'!';
  ui.spot={loc:m.loc,pi,phase:'done',text:p.name+' '+what+(won.length?'':'.'),got,took,served,dw,dv};
  sfx(served.length?'serve':'place');
}

  if(S.over) return;
  if(ui.welcome||ui.fx||ui.queue.length||ui.sheet||ui.menu){ui.botT=setTimeout(schedule,400); return;}
  if(!S.players[S.turn].bot){ui.markId=S.logN; if(ui.spot&&ui.spot.phase==='done') ui.botT=setTimeout(()=>{if(S.players[S.turn]&&!S.players[S.turn].bot&&ui.spot&&ui.spot.phase==='done'){ui.spot.fading=true; render();}},2200); return;}
  const q=SND.quick, going=ui.spot&&ui.spot.phase==='go';
  ui.botT=setTimeout(()=>{
    if(ui.welcome||ui.fx||ui.queue.length||ui.sheet||ui.menu||S.over||!S.players[S.turn].bot) return schedule();
    if(going) botResolve(); else botIntent();
    render(); schedule();
  },going?(q?450:1000):(q?500:1500));
}
function startNew(){
  clearTimeout(ui.botT);
  try{localStorage.setItem('kaiten-bots',String(ui.nBots)); localStorage.setItem('kaiten-level',ui.level); localStorage.setItem('kaiten-char',ui.char); localStorage.setItem('kaiten-rules',JSON.stringify(ui.rules));}catch(e){}
  S=newGame({nBots:ui.nBots,level:ui.level,you:ui.char,rules:ui.rules}); Object.assign(ui,{vpShown:null,catShown:null,catBump:{},fx:null,welcome:false,live:true,sheet:null,sel:[],endOpen:true,menu:false,queue:[],spot:null,markId:S.logN});
  render(); schedule();
}
function defaultRice(){
  const me=S.players[0], k=pantryCount(S,me); let r=0,nn=0;
  me.orders.forEach(id=>{const c=countCost(DISH[id].cost); r+=c.R; nn+=c.N;}); r-=me.hand.R; nn-=me.hand.N;
  if(r<=0&&nn<=0) return Math.ceil(k/2); if(nn<=0) return k; if(r<=0) return 0; return Math.round(k*r/(r+nn));
}
function humanAct(loc,args){
  const me=S.players[0], n0=me.tableau.length, vp0=score(me).total;
  ui.spot=null; const fresh=doAct(0,loc,args); sfx('place'); ui.markId=S.logN;
  const ids=me.tableau.slice(n0);
  if(ids.length){
    const notes=fresh.filter(l=>l.k==='serve'&&/\+\d+ (bonus|event|old master)/.test(l.t)).map(l=>l.t.match(/\((.*)\)/)[1].split(', ').slice(1).join(', '));
    // VP from regulars is celebrated on its own card, so count plates, bonuses and sets here
    const regVP=fresh.filter(l=>l.k.startsWith('regular:')&&l.pi===0).reduce((a,l)=>a+REG[l.k.slice(8)].vp,0);
    ui.fx={ids,vp:score(me).total-vp0-regVP,notes};
    clearTimeout(ui.fxT); ui.fxT=setTimeout(()=>{if(ui.fx){ui.fx=null; render(); schedule();}},2300);
  }
  render(); schedule();
}
function pickLoc(id,direct){
  if(isPhone()&&!direct){ui.sheet='st:'+id; ui.sel=[]; return render();}
  if(S.over||S.turn!==0||!legal(S,0,id)) return;
  if(id==='door'||id==='staff'){ui.sheet=null; return humanAct(id,{});}
  const me=S.players[0]; ui.sel=[];
  if(id==='prep'||id==='head'){const f=me.orders.find(x=>canCook(me,DISH[x])); if(f) ui.sel=[f];}
  ui.sheet=id; ui.rice=defaultRice(); render();
}
function confirmSheet(){
  const loc=ui.sheet, sel=ui.sel;
  if(loc.startsWith('st:')){ui.sheet=null; return pickLoc(loc.slice(3),true);}
  const args=loc==='market'?{picks:sel}:loc==='pantry'?{rice:ui.rice}:loc==='belt'?{slots:sel}:loc==='prep'?{dish:sel[0]}:{dishes:sel};
  ui.sheet=null; ui.sel=[]; humanAct(loc,args);
}

/* ----- overlays: events, regulars won, and the recap of rival turns ----- */
function overlayHTML(){
  const q=ui.queue[0]; if(!q) return '';
  if(q.type==='event'){
    const e=EVT[q.id];
    return '<div class="ov ev-ov"><div class="evcard" role="dialog" aria-modal="true" aria-label="'+esc(e.name)+'"><span class="evkj" lang="ja">'+e.kj+'</span>'+
      '<span class="evround">Round '+S.round+' event</span><h2>'+esc(e.name)+'</h2><p>'+esc(e.text)+'</p>'+
      '<button type="button" class="gbtn" data-act="dq">Back to the counter</button></div></div>';
  }
  if(q.type==='regular'){
    const r=REG[q.r];
    const petals=Array.from({length:18},(_,i)=>'<span class="petal" style="--x:'+((i*37)%100)+'%;--d:'+(4+(i%5)*0.8)+'s;--dl:'+(-(i%7)*0.7)+'s;--dx:'+((i%2?1:-1)*(30+(i*13)%70))+'px"></span>').join('');
    return '<div class="ov celebrate">'+petals+'<div class="cel-card" role="dialog" aria-modal="true" aria-label="New regular">'+
      '<span class="cel-kicker">New regular!</span><span class="cel-pic"><img class="face" src="'+A('reg-'+q.r)+'" alt=""><span class="cel-vp num">+'+r.vp+'<small>VP</small></span></span>'+
      '<h2>The '+esc(r.name)+' is yours</h2><p>'+esc(reqText(r))+': served. They’ll be back every week.</p>'+
      '<button type="button" class="gbtn" data-act="dq">Irasshaimase!</button></div></div>';
  }
  if(q.type==='morning'){
    // dismisses itself after a few seconds; tap to skip
    if(!q.timer){q.timer=1; setTimeout(()=>{if(ui.queue[0]===q){ui.queue.shift(); render(); schedule();}},4600);}
    let k=0; const chip=(img,txt,cls,title)=>'<span class="mchip'+(cls?' '+cls:'')+'" style="--d:'+(0.35+0.12*(k++))+'s" title="'+esc(title)+'"><img src="'+img+'" alt="">'+txt+'</span>';
    const rows=q.gains.map((g,i)=>{
      const p=S.players[i]; k=i*2;
      const chips=(g.R?chip(ingArt('R'),'+'+g.R,'','Rice'):'')+(g.N?chip(ingArt('N'),'+'+g.N,'','Nori'):'')+(g.W?chip(ingArt('W'),'+'+g.W,'','Wasabi'):'')+
        g.F.map(f=>chip(ingArt(f),'+1','',ING_NAME[f])).join('')+(g.tip?chip(ingArt('W'),'+'+g.tip+' tip','tip','Catch-up tip from the regulars'):'');
      return '<li class="pc'+p.color+'" style="--d:'+(0.15+0.1*i)+'s"><img class="face" src="'+chefArt(p.chef)+'" alt=""><b>'+esc(p.name)+'</b><span class="mchips">'+(chips||'<span class="mnone">nothing yet</span>')+'</span></li>';
    }).join('');
    return '<div class="ov morning" data-act="dq"><div class="mcard" role="dialog" aria-modal="true" aria-label="Morning delivery">'+
      '<span class="cel-kicker"><span lang="ja">朝</span> Round '+q.round+' · morning delivery</span><h2>The suppliers drop by</h2>'+
      '<ul class="mrows">'+rows+'</ul><p class="mhint">From dishes marked “Each round” on your counter, plus catch-up tips.</p>'+
      '<button type="button" class="gbtn" data-act="dq">Start the round</button></div></div>';
  }
  if(q.type==='lostreg'){
    const r=REG[q.r], p=S.players[q.pi];
    return '<div class="ov lostreg"><div class="cel-card" role="dialog" aria-modal="true" aria-label="Regular lost">'+
      '<span class="cel-kicker">Regular lost</span><div class="lr-row"><span class="cel-pic"><img class="face" src="'+A('reg-'+q.r)+'" alt=""><span class="xout" aria-hidden="true"></span></span>'+
      '<span class="lr-arrow" aria-hidden="true">→</span>'+
      '<span class="lr-rival pc'+p.color+'"><img class="face" src="'+chefArt(p.chef)+'" alt=""><b>'+esc(p.name)+'</b><span class="num">+'+r.vp+' VP</span></span></div>'+
      '<h2>'+esc(p.name)+' won the '+esc(r.name)+'</h2><p>'+esc(reqText(r))+'. They’re off the waiting list now.</p>'+
      '<button type="button" class="gbtn wood" data-act="dq">Next time</button></div></div>';
  }
  if(q.type==='recap'){
    const rows=S.log.filter(l=>l.id>q.from&&l.pi!==0&&l.k!=='morning'&&l.k!=='tip').reverse().map(l=>{
      let icon=l.pi>=0?'<img class="face" src="'+chefArt(S.players[l.pi].chef)+'" alt="">':'<span class="sysk" lang="ja">'+(l.k==='event'?EVT[S.event]?.kj||'祭':'回')+'</span>';
      if(l.k==='tip') icon='<img class="ic" src="'+ingArt('W')+'" alt="">';
      return '<li class="'+(l.k.startsWith('regular')?'won':l.k==='tip'?'tip':'')+'">'+icon+'<span>'+esc(l.t)+'</span>'+dvHTML(l)+'</li>';
    }).join('');
    return '<div class="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="While you were cooking"><div class="sheet-h"><h2>While you were cooking…</h2><p>Here’s what happened since your last move.</p></div>'+
      '<div class="sheet-b"><ul class="recap">'+rows+'</ul></div><div class="sheet-f"><button type="button" class="gbtn" data-act="dq">Your turn</button></div></div></div>';
  }
  return '';
}
function actbarHTML(){
  const sp=ui.spot; if(!sp||sp.fading||ui.queue.length||S.players[S.turn]===undefined) return '';
  const p=S.players[sp.pi];
  let bits='';
  if(sp.phase==='done'){
    bits=sp.got.filter(k=>sp.loc!=='market'||FISH.includes(k)).map(k=>'<img class="mvi" src="'+ingArt(k)+'" alt="'+ING_NAME[k]+'">').join('')+
      sp.took.map(id=>'<img class="mvd" src="'+dishArt(id)+'" alt="">').join('')+sp.served.map(id=>'<img class="mvd" src="'+dishArt(id)+'" alt="">').join('')+
      (sp.dw>0?'<span class="mvw"><img class="mvi" src="'+ingArt('W')+'" alt="">+'+sp.dw+'</span>':'')+(sp.dv>0?'<span class="mvv num">+'+sp.dv+' VP</span>':'');
  }
  return '<div class="actbar mv pc'+p.color+(sp.phase==='go'?' go':' done')+'" aria-live="polite"><img class="face" src="'+chefArt(p.chef)+'" alt="">'+
    '<img class="mvst" src="'+A('st-'+sp.loc)+'" alt=""><span class="mvt">'+esc(sp.text)+(bits?'<span class="mvb">'+bits+'</span>':'')+'</span></div>';
}

app.addEventListener('pointerdown',audioInit);
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-loc],[data-pick],[data-open],[data-reg],[data-rice],[data-start],[data-toggle],[data-wr],[data-wl],[data-wc],[data-rule],[data-dish],[data-take],[data-car],[data-logf],[data-act]');
  if(!t) return;
  const d=t.dataset;
  if(d.loc) return pickLoc(d.loc);
  if(d.open){ui.menu=false; ui.sheet=d.open; ui.sel=[]; if(d.open==='seats') ui.carJump=d.seat!=null?+d.seat+1:0; return render();}
  if(d.reg!=null){ui.sheet='reg'; ui.carJump=S.regulars.slice(0,+d.reg).filter(Boolean).length; return render();}
  if(d.dish!=null){ui.sheet='dish'; ui.carJump=S.belt.slice(0,+d.dish).filter(Boolean).length; sfx('pick'); return render();}
  if(d.take!=null){if(t.disabled||S.turn!==0||!legal(S,0,'belt')) return; ui.sheet=null; return humanAct('belt',{slots:[+d.take]});}
  if(d.car){const c=app.querySelector('.car'); if(c) c.scrollBy({left:(+d.car)*c.clientWidth,behavior:'smooth'}); return;}
  if(d.wc){ui.char=d.wc; sfx('pick'); return render();}
  if(d.rule){ui.rules[d.rule]=!ui.rules[d.rule]; sfx('pick'); return render();}
  if(d.logf){ui.logF=d.logf==='all'?null:+d.logf; return render();}
  if(d.start) return startNew();
  if(d.wr){ui.nBots=+d.wr; sfx('pick'); return render();}
  if(d.wl){ui.level=d.wl; sfx('pick'); return render();}
  if(d.toggle){SND[d.toggle]=!SND[d.toggle]; saveSnd(); setGains(); return render();}
  if(d.rice){const k=pantryCount(S,S.players[0]); ui.rice=Math.max(0,Math.min(k,ui.rice+(+d.rice))); sfx('pick'); return render();}
  if(d.pick!=null){
    if(t.disabled) return;
    const v=ui.sheet==='prep'||ui.sheet==='head'?d.pick:+d.pick, max=maxPick();
    if(ui.sel.includes(v)) ui.sel=ui.sel.filter(x=>x!==v); else if(max===1) ui.sel=[v]; else if(ui.sel.length<max) ui.sel.push(v);
    sfx('pick'); return render();
  }
  switch(d.act){
    case 'menu': ui.menu=!ui.menu; return render();
    case 'copylog': copyLog(); return;
    case 'welcome': Object.assign(ui,{welcome:true,menu:false,sheet:null,endOpen:false}); clearTimeout(ui.botT); return render();
    case 'continue': ui.welcome=false; ui.markId=S.logN; ui.vpShown=null; ui.catShown=null; render(); return schedule();
    case 'fxdone': clearTimeout(ui.fxT); ui.fx=null; render(); return schedule();
    case 'cancel': ui.sheet=null; ui.sel=[]; render(); return schedule();
    case 'confirm': return confirmSheet();
    case 'closeend': ui.endOpen=false; return render();
    case 'dq': {const q=ui.queue.shift(); if(q&&q.type==='recap') ui.spot=null; render(); return schedule();}
    case 'evshow': ui.queue.push({type:'event',id:S.event}); return render();
    case 'veil': if(e.target===t){ui.sheet=null; ui.sel=[]; render(); schedule();} return;
  }
});
function carDots(c){
  const i=Math.round(c.scrollLeft/Math.max(1,c.clientWidth));
  c.closest('.deck')?.querySelectorAll('.cdot').forEach((d,k)=>d.classList.toggle('on',k===i));
}
app.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('car')) carDots(e.target);},true);
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.dish!=null){e.preventDefault(); e.target.click();}});

/* ----- drag a chef from your tray straight onto a station ----- */
let drag=null;
app.addEventListener('pointerdown',e=>{
  const f=e.target.closest('[data-drag]');
  if(!f||S.over||S.turn!==0||ui.sheet||ui.queue.length||ui.welcome||ui.fx) return;
  e.preventDefault(); audioInit();
  const g=document.createElement('img'); g.src=f.src; g.className='face dragghost'; g.alt=''; document.body.appendChild(g);
  drag={g,x0:e.clientX,y0:e.clientY,moved:false,over:null};
  document.body.classList.add('dragging'); dragMove(e);
});
function dragMove(e){
  if(!drag) return;
  drag.g.style.transform='translate('+(e.clientX-28)+'px,'+(e.clientY-40)+'px) scale('+(drag.moved?1.15:1)+')';
  if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>6) drag.moved=true;
  const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('.board[data-loc]'), loc=b&&b.dataset.loc;
  if(loc!==drag.over){app.querySelectorAll('.board.drop').forEach(x=>x.classList.remove('drop')); if(b&&legal(S,0,loc)) b.classList.add('drop'); drag.over=loc;}
}
function dragEnd(e,cancel){
  if(!drag) return;
  const d=drag; drag=null; d.g.remove(); document.body.classList.remove('dragging');
  app.querySelectorAll('.board.drop').forEach(x=>x.classList.remove('drop'));
  if(cancel) return;
  if(!d.moved) return flash('Drag a chef onto a station, or tap a station'), render();
  if(d.over&&legal(S,0,d.over)) return pickLoc(d.over,true);
  if(d.over){flash(whyNot(S,0,d.over)||'Not here'); render();}
}
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',e=>dragEnd(e,false));
document.addEventListener('pointercancel',e=>dragEnd(e,true));

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.sheet||ui.menu)){ui.sheet=null; ui.sel=[]; ui.menu=false; render(); schedule();}});
// a mouse wheel over the belt or the order clips scrolls them sideways
app.addEventListener('wheel',e=>{
  const el=e.target.closest('.track,.orders');
  if(el&&Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){el.scrollLeft+=e.deltaY; e.preventDefault();}
},{passive:false});

function start(data){
  try{const k=+localStorage.getItem('kaiten-bots'); if(k>=1&&k<=3) ui.nBots=k; const l=localStorage.getItem('kaiten-level'); if(LEVEL_INFO[l]) ui.level=l; const c=localStorage.getItem('kaiten-char'); if(CHAR[c]) ui.char=c; Object.assign(ui.rules,JSON.parse(localStorage.getItem('kaiten-rules')||'{}'));}catch(e){}
  let saved=null; try{saved=JSON.parse(localStorage.getItem('kaiten-save')||'null');}catch(e){}
  if(data&&data.state){S=data.state; Object.assign(ui,data.ui||{},{welcome:false,live:true});}
  else if(saved&&saved.state&&!saved.state.over){S=saved.state; ui.live=true;}
  else S=newGame({nBots:ui.nBots,level:ui.level,you:ui.char,rules:ui.rules});
  S.players.forEach(p=>{if(p.chef==null){p.chef=p.color; p.char=CHARS[p.color].id;}});
  ui.markId=S.logN||0;
  render(); schedule();
}
window.claude?.hot?.snapshot?.(()=>({state:S,ui:{nBots:ui.nBots,endOpen:ui.endOpen}}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
